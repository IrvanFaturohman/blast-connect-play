<!DOCTYPE html>
<!-- [P] Blast Connect's WebGL template (user 2026-11-13: "resolusinya yang bener, potrait dong"): the game is a portrait
     phone game, so the canvas fills the screen on a phone and is a centred 9:16 column on a wide screen. No Unity footer.
     Builder.WebGL selects it (PlayerSettings.WebGL.template = "PROJECT:Portrait"). -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#9dc2f5">
    <title>Blast Connect</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #9dc2f5; touch-action: none;
        -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
      #game { position: fixed; top: 0; bottom: 0; left: 50%; transform: translateX(-50%);
        height: 100vh; height: 100dvh; width: 100vw; max-width: calc(100dvh * 9 / 16); }
      @supports not (height: 100dvh) { #game { max-width: calc(100vh * 9 / 16); } }
      #unity-canvas { display: block; width: 100%; height: 100%; background: #9dc2f5; outline: none; }
      #loading { position: absolute; left: 0; right: 0; top: 0; bottom: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 18px; font: 700 20px system-ui, sans-serif; color: #2b4a8a; }
      #bar { width: 60%; height: 14px; border-radius: 7px; background: #ffffff80; overflow: hidden; }
      #fill { width: 0; height: 100%; border-radius: 7px; background: #3d7be0; transition: width .2s; }
      #error { position: absolute; left: 12px; right: 12px; bottom: 12px; padding: 10px; border-radius: 8px;
        background: #d33; color: #fff; font: 14px system-ui, sans-serif; display: none; }
    </style>
  </head>
  <body>
    <div id="game">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="loading"><div>Blast Connect</div><div id="bar"><div id="fill"></div></div></div>
      <div id="error"></div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      function showBanner(msg, type) {
        if (type != 'error') { console.warn(msg); return; }
        var e = document.querySelector("#error"); e.textContent = msg; e.style.display = 'block';
      }
      var buildUrl = "Build";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/WebGL.data.unityweb",
        frameworkUrl: buildUrl + "/WebGL.framework.js.unityweb",
        codeUrl: buildUrl + "/WebGL.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Irvan Faturohman",
        productName: "Blast Connect",
        productVersion: "0.1.0",
        showBanner: showBanner,
      };
      var script = document.createElement("script");
      script.src = buildUrl + "/WebGL.loader.js";
      script.onload = function () {
        createUnityInstance(canvas, config, function (p) {
          document.querySelector("#fill").style.width = (100 * p) + "%";
        }).then(function () {
          document.querySelector("#loading").style.display = "none";
        }).catch(function (message) { showBanner(String(message), 'error'); });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
